name: tests
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package and the CAD kernel
        run: pip install .
      - name: Run the tests from the checkout
        run: python -m unittest discover -s tests -t .
      - name: Run the installed copy from another folder
        run: |
          cd "$RUNNER_TEMP"
          python -m frc_design_kernel --version
          python -m frc_design_kernel validate "$GITHUB_WORKSPACE/examples/lifter/design.json"
          python -m frc_design_kernel build "$GITHUB_WORKSPACE/examples/lifter/design.json" --out out
          python -c "import json; made = json.load(open('out/manifest.json'))['generator']; print(made); assert made['version']"
          python -m frc_design_kernel measure "$GITHUB_WORKSPACE/examples/lifter/design.json" --out out --touch-gap 1 --workers 2
          python -m frc_design_kernel try "$GITHUB_WORKSPACE/examples/lifter/design.json" --out out
          python -m frc_design_kernel status "$GITHUB_WORKSPACE/examples/lifter/design.json" out
          python -m frc_design_kernel screen "$GITHUB_WORKSPACE/examples/lifter/design.json" --out out

  tests-mujoco:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the package with the optional 3D engine
        run: pip install ".[mujoco]"
      - name: Run the 3D engine tests
        run: python -m unittest tests.test_mujoco tests.test_mujoco_moving tests.test_mujoco_parts -v
